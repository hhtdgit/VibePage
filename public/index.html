<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePage - 全幻觉页面</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 桌面背景 -->
    <div class="desktop" id="desktop">
        <div class="desktop-brand">VibePage</div>
        <!-- 全局搜索框 -->
        <div class="search-bar">
            <input type="text" placeholder="🔍 想要什么应用随便搜..." id="searchInput" autocomplete="off">
            <div id="suggestions" class="search-suggestions"></div>
        </div>

        <!-- 窗口容器（动态插入） -->
        <div id="window-container"></div>
    </div>

    <!-- 底部任务栏 -->
    <div class="dock">
        <!-- 启动器图标 -->
        <div class="dock-launchers">
            <div class="dock-item dock-launcher" data-app="能够添加，删除，管理笔记的备忘录" title="备忘录">
                <span>📝</span>
            </div>
            <div class="dock-item dock-launcher" data-app="能够实现简单运算的计算器" title="计算器">
                <span>🧮</span>
            </div>
            <div class="dock-item dock-launcher" data-app="google样式的浏览器，有搜索框，书签页，今日推荐。可根据用户输入在搜索后渲染下一界面。" title="浏览器">
                <span>🌐</span>
            </div>
            <div class="dock-item dock-launcher"
                data-app="linux风格终端。能够执行基本命令如help,ls, mkdir, cd, touch等，能够正常实现逻辑。如果不是默认支持的应用，都应该基于用户输入重新渲染下一界面。"
                title="终端">
                <span>💻</span>
            </div>
            <div class="dock-item dock-launcher"
                data-app="能够上传本地文件的音乐播放器。默认需要有一两首有音调和节奏的好听的电子鼓点歌曲，可以直接播放/切歌/暂停。可以有音乐搜索，基于用户输入重新渲染下一界面。" title="音乐">
                <span>🎵</span>
            </div>
        </div>

        <!-- 分隔线 -->
        <div class="dock-separator"></div>

        <!-- 正在运行的应用 -->
        <div id="dock-tasks"></div>

        <!-- 分隔线 -->
        <div class="dock-separator"></div>

        <!-- 全屏按钮 -->
        <div class="dock-item" id="fullscreen-btn" title="全屏">
            <span>⛶</span>
        </div>

        <!-- 导入按钮 -->
        <div class="dock-item" id="import-btn" title="导入应用快照">
            <span>📂</span>
        </div>
        <input type="file" id="import-file-input" accept=".html" style="display:none">
    </div>

    <!-- JS 模块 -->
    <script src="js/window-manager.js"></script>
    <script src="js/ai-generator.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
